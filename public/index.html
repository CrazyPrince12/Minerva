<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minerva</title>
  <meta name="description" content="Minerva — votre assistant IA minimaliste, développé par Crazy Prince Dev." />
  <meta name="author" content="Crazy Prince Dev" />
  <meta name="theme-color" content="#0f1117" />

  <!-- Open Graph / partage réseaux sociaux -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Minerva" />
  <meta property="og:title" content="Minerva — Assistant IA minimaliste" />
  <meta property="og:description" content="Discute avec Minerva : dev web, code, tech, recherche et plus. Développé par Crazy Prince Dev." />
  <meta property="og:url" content="https://minerva-chat.vercel.app/" />
  <!-- Remplace cette URL par ton domaine réel après déploiement (voir README). -->
  <meta property="og:image" content="https://minerva-chat.vercel.app/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Logo Minerva sur fond sombre, assistant IA minimaliste." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Minerva — Assistant IA minimaliste" />
  <meta name="twitter:description" content="Discute avec Minerva : dev web, code, tech, recherche et plus. Développé par Crazy Prince Dev." />
  <meta name="twitter:image" content="https://minerva-chat.vercel.app/assets/og-image.png" />

  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />

  <!-- Icônes : Font Awesome 6 (aucun emoji dans l'interface). -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    referrerpolicy="no-referrer"
  />

  <link rel="stylesheet" href="/style.css?v=20260902-1" />

  <script>
    // Applique le thème avant le rendu pour éviter le flash.
    (function () {
      try {
        document.documentElement.dataset.theme = localStorage.getItem("minerva.theme") || "dark";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
</head>
<body>
  <header class="app-header" role="banner">
    <a class="brand" href="/" aria-label="Accueil Minerva">
      <img class="brand-logo" src="/assets/logo.svg" width="44" height="44" alt="Logo Minerva" />
      <span class="brand-name">Minerva</span>
    </a>

    <div class="header-actions">
      <button id="clear-chat" class="icon-button" type="button" aria-label="Effacer la conversation" title="Effacer la conversation">
        <i class="fa-regular fa-trash-can" aria-hidden="true"></i>
      </button>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Changer de thème" title="Changer de thème">
        <i id="theme-icon" class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main id="chat" class="chat">
    <div id="empty-state" class="empty-state">
      <img class="empty-logo" src="/assets/logo.svg" width="72" height="72" alt="" />
      <h1 id="greeting" class="greeting"></h1>
      <p class="empty-subtitle">Pose une question, colle un bug, demande un plan, explore une idée…</p>
    </div>

    <div id="messages" class="messages" aria-label="Conversation" role="log" aria-live="polite"></div>
  </main>

  <footer class="composer-wrap">
    <form id="chat-form" class="composer" autocomplete="off">
      <label for="user-input" class="sr-only">Votre message à Minerva</label>
      <textarea
        id="user-input"
        name="message"
        rows="1"
        placeholder="Écris à Minerva…"
        aria-label="Écris à Minerva"
        enterkeyhint="send"
      ></textarea>
      <button id="send-btn" class="send-button" type="submit" aria-label="Envoyer le message" title="Envoyer le message">
        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
      </button>
    </form>
    <p class="composer-note"><span aria-hidden="true">Entrée</span> pour envoyer · <span aria-hidden="true">Maj + Entrée</span> pour un retour à la ligne</p>
  </footer>

  <div id="error-toast" class="error-toast" role="alert" hidden></div>

  <div id="thinking" class="thinking sr-only" role="status" aria-live="assertive">
    <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
    <span id="thinking-text">Minerva réfléchit…</span>
  </div>

  <!-- La version évite de réutiliser le JS incompatible mis en cache avant ce correctif. -->
  <script src="/script.js?v=20260902-1" type="module"></script>
</body>
</html>
